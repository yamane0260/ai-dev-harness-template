name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harness self-test
        run: ./scripts/ai/self-test

      - name: Determine risk floor
        id: risk
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          RISK="$(./scripts/ai/classify-risk --base "$BASE" --format level)"
          echo "risk=$RISK" >> "$GITHUB_OUTPUT"
          echo "Risk floor: $RISK"

      - name: Run required gates
        shell: bash
        run: |
          if [[ -f ai/TEMPLATE_MODE ]]; then
            ./scripts/ai/verify --harness --risk "${{ steps.risk.outputs.risk }}"
          else
            ./scripts/ai/verify --risk "${{ steps.risk.outputs.risk }}"
          fi

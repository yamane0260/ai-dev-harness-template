# Verification commands for maintaining this template repository itself.
# Adopted product repositories continue to configure ai/commands.conf.

PROJECT_READY=true

TYPECHECK_CMD="python3 -m py_compile scripts/ai/lib/__init__.py scripts/ai/lib/assurance_core.py scripts/ai/lib/agent_trace.py scripts/ai/validate-assurance scripts/ai/record-evidence scripts/ai/build-project-index scripts/ai/record-agent-event scripts/ai/validate-agent-trace scripts/ai/tests/test_assurance.py scripts/ai/tests/test_agent_trace.py scripts/ai/tests/test_project_index.py"
TYPECHECK_NA_REASON=""

LINT_CMD="bash -n scripts/ai/self-test scripts/ai/classify-risk scripts/ai/verify scripts/ai/validate-approval && git diff --check"
LINT_NA_REASON=""

UNIT_CMD="python3 -m unittest discover -s scripts/ai/tests -p 'test_*.py'"
UNIT_NA_REASON=""

INTEGRATION_CMD="./scripts/ai/self-test && ./scripts/ai/verify --risk green"
INTEGRATION_NA_REASON=""

E2E_CMD=""
E2E_NA_REASON="The template has no product runtime or end-user journey."

BUILD_CMD=""
BUILD_NA_REASON="The harness is distributed as source files and has no build artifact."

SECURITY_CMD="python3 -m unittest scripts/ai/tests/test_agent_trace.py"
SECURITY_NA_REASON=""

DEPENDENCY_CMD=""
DEPENDENCY_NA_REASON="V3 utilities use only the Python standard library and add no package dependency or lockfile."

ARCHITECTURE_CMD="./scripts/ai/build-project-index"
ARCHITECTURE_NA_REASON=""

VISUAL_CMD=""
VISUAL_NA_REASON="V3 adds repository data/CLI contracts but no graphical user interface."
